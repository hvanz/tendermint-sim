<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tendermint Consensus Simulator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="pseudocode-open">
    <h1>Tendermint Consensus Simulator</h1>

    <div id="controls">
        <button id="btn-reset">Reset</button>
        <button id="btn-undo" disabled>Undo</button>
        <button id="btn-step-all">Random steps</button>
        <button id="btn-pseudocode" style="margin-left: auto" disabled>Pseudocode</button>
    </div>

    <div id="main-area">
        <div id="left-pane">
            <div class="column-header">Next Step</div>
        </div>
        <div id="state-pane">
            <div class="column-header">Current State</div>
        </div>
        <div id="timeline-wrapper">
            <div class="column-header timeline-header">
                <span>Timeline</span>
                <button id="btn-save-trace">Save trace</button>
            </div>
            <div id="timeline-container">
                <svg></svg>
            </div>
        </div>
    </div>

    <div id="pseudocode-pane">
        <div class="pseudocode-header">
            <span class="pseudocode-tabs">
                <button class="pc-tab active" data-node="0">p0</button>
                <button class="pc-tab" data-node="1">p1</button>
                <button class="pc-tab" data-node="2">p2</button>
                <button class="pc-tab" data-node="3">p3</button>
            </span>
            <span style="margin-left: auto; font-size: 10px">[<a href="https://arxiv.org/abs/1807.04938" target="_blank" style="color: #3b82f6; text-decoration: none">paper</a>]</span>
            <button id="btn-close-pseudocode" title="Close pseudocode">&times;</button>
        </div>
        <div id="pseudocode-lines"></div>
    </div>

    <div id="legend">
        <div class="legend-item">
            <div class="legend-swatch" style="background: var(--color-propose)"></div>
            <span>Propose</span>
        </div>
        <div class="legend-item">
            <div class="legend-swatch" style="background: var(--color-prevote)"></div>
            <span>Prevote</span>
        </div>
        <div class="legend-item">
            <div class="legend-swatch" style="background: var(--color-precommit)"></div>
            <span>Precommit</span>
        </div>
        <div class="legend-item">
            <div class="legend-swatch" style="background: var(--color-decided)"></div>
            <span>Decided</span>
        </div>
        <div class="legend-item">
            <div class="legend-line" style="background: var(--color-proposal-arrow)"></div>
            <span>PROPOSAL</span>
        </div>
        <div class="legend-item">
            <div class="legend-line" style="background: var(--color-prevote-arrow)"></div>
            <span>PREVOTE</span>

        </div>
        <div class="legend-item">
            <div class="legend-line" style="background: var(--color-precommit-arrow)"></div>
            <span>PRECOMMIT</span>
        </div>
        <div class="legend-item">
            <div class="legend-line legend-line-dashed" style="background: repeating-linear-gradient(90deg, #888 0 4px, transparent 4px 7px)"></div>
            <span>nil vote</span>
        </div>
        <div class="legend-item">
            <span style="color: #dc2626; font-weight: bold; font-size: 14px">&#x2716;</span>
            <span>message not received</span>
        </div>
        <div class="legend-item">
            <span style="font-size: 14px">&#x23f3;</span>
            <span>timeout scheduled</span>
        </div>
    </div>

    <div id="traces-section">
        <span class="traces-label">Predefined traces:</span>
        <span id="traces-list"></span>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
