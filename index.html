<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tendermint Consensus Simulator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="pseudocode-open">
    <div id="topbar">
        <h1>Tendermint Consensus Simulator</h1>
        <div id="controls">
            <button id="btn-reset">Reset</button>
            <select id="trace-select">
                <option value="empty">Predefined traces</option>
            </select>
            <button id="btn-pseudocode" style="margin-left: auto" disabled>Pseudocode</button>
        </div>
    </div>

    <div id="main-area">
        <div id="timeline-wrapper">
            <div class="column-header timeline-header">
                <span>Timeline <button id="btn-help" title="Legend" aria-label="Legend">?</button></span>
                <button id="btn-save-trace">Save trace</button>
            </div>
            <div id="timeline-container">
                <svg></svg>
            </div>
        </div>
        <div id="state-pane">
            <div class="column-header">Current State</div>
        </div>
        <div id="left-pane">
            <div class="column-header next-step-header">
                <span>Next Step</span>
                <span class="next-step-actions">
                    <button id="btn-undo" disabled title="Undo one step">Undo</button>
                    <button id="btn-step-all" title="For each node, in random order, pick any of the enabled next steps.">Random</button>
                </span>
            </div>
        </div>
    </div>

    <div id="pseudocode-pane">
        <div class="pseudocode-header">
            <span class="pseudocode-tabs">
                <button class="pc-tab active" data-node="0">p0</button>
                <button class="pc-tab" data-node="1">p1</button>
                <button class="pc-tab" data-node="2">p2</button>
                <button class="pc-tab" data-node="3">p3</button>
            </span>
            <span style="margin-left: auto; font-size: 10px">[<a href="https://arxiv.org/abs/1807.04938" target="_blank" style="color: var(--accent-proposal); text-decoration: none">paper</a>]</span>
            <button id="btn-close-pseudocode" title="Close pseudocode">&times;</button>
        </div>
        <div id="pseudocode-lines"></div>
    </div>

    <dialog id="save-trace-dialog">
        <div class="dialog-header">
            <strong>Save trace</strong>
            <button id="btn-close-save-trace" title="Close" aria-label="Close">&times;</button>
        </div>
        <form id="save-trace-form" method="dialog">
            <label for="save-trace-name">Trace name</label>
            <input id="save-trace-name" type="text" required placeholder="My trace" autocomplete="off">
            <div class="dialog-actions">
                <button type="button" id="btn-cancel-save-trace">Cancel</button>
                <button type="submit" id="btn-confirm-save-trace">Download</button>
            </div>
            <div id="save-trace-toast" hidden></div>
        </form>
    </dialog>

    <dialog id="help-dialog">
        <div class="dialog-header">
            <strong>Legend</strong>
            <button id="btn-close-help" title="Close" aria-label="Close">&times;</button>
        </div>
        <ul class="help-list">
            <li>
                <div class="legend-line legend-line-dashed" style="background: repeating-linear-gradient(90deg, var(--text-secondary) 0 4px, transparent 4px 7px)"></div>
                <span>nil vote</span>
            </li>
            <li>
                <span style="color: var(--accent-timeout); font-weight: bold; font-size: 14px">&#x2716;</span>
                <span>message not received</span>
            </li>
            <li>
                <span style="font-size: 14px">&#x23f3;</span>
                <span>timer started</span>
            </li>
            <li>
                <span style="font-size: 14px">&#x23f0;</span>
                <span>timer expired</span>
            </li>
        </ul>
    </dialog>

    <script type="module" src="js/main.js"></script>
</body>
</html>
